<html lang="id">
<head>

  <title>Laporan Mentor AI - Ibadah Tracker</title>
  <link rel="stylesheet" href="ibadah-tracker.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Sedikit penyesuaian untuk halaman laporan */
    #laporan-container {
      padding: 25px;
      background: var(--specific-bg-light, #fff);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .action-buttons button {
      flex-grow: 1;
      padding: 12px;
      font-size: 0.95em;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    #btnDownloadPdf {
      background: var(--brand-color);
      color: #fff;
    }
    #btnKembali {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }
  </style>
</head>
<body>

<header class="main-header">
  <h1>Ibadah Tracker AI</h1>
  <p class="hadith-quote">Laporan Analisis & Rekomendasi dari Murabbi Digital Anda</p>
</header>

<div id="ibadah-box">
  <h4>✨ Laporan Mentor AI</h4>
  <div id="laporan-container">
    <!-- Konten Laporan AI akan dimuat di sini oleh JavaScript -->
    <p>Memuat laporan...</p>
  </div>
  <div class="action-buttons">
    <button id="btnKembali" onclick="history.back()">Kembali</button>
    <button id="btnDownloadPdf">Unduh sebagai PDF</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="ibadah-tracker.js" defer></script>

</body>
</html>
